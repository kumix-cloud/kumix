name: 💡 Feature request
description: Suggest a new feature or an improvement to Kumix
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Kumix! Please search existing requests first — if one exists, add a 👍 reaction instead of opening a duplicate.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been requested yet
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Servers / VPS
        - SSH keys
        - Websites / WordPress
        - Apps (one-click deploy)
        - Domains & SSL
        - Monitoring & alerts
        - AI assistant
        - Billing & plans
        - Teams & permissions
        - Account, login & 2FA
        - New area / Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the need or pain point, not just the solution.
      placeholder: I manage 20 WordPress sites and have to update plugins on each one separately.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like Kumix to solve it?
      placeholder: A bulk action to update plugins across selected sites at once.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / current workaround
      description: What do you do today, or what other options have you considered?

  - type: dropdown
    id: impact
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Important — saves me significant time
        - Critical — blocking my use of Kumix
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, links to similar features in other tools, etc.
